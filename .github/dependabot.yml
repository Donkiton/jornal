version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Обычные обновления версий отключены; обновления безопасности остаются активны в настройках репозитория.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Обычные обновления версий отключены; обновления безопасности остаются активны в настройках репозитория.
    open-pull-requests-limit: 0
